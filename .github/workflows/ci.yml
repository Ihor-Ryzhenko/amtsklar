name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, build]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        if: matrix.check == 'test'
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm ${{ matrix.check }}

  review:
    name: review
    # Runs only after every check has passed.
    needs: check
    # Pull requests only, not drafts. Secrets are not available to pull requests from
    # forks, so skip those.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The rules come from the base branch, so a pull request cannot change the rules it
      # is reviewed against.
      - name: Read review rules from the base branch
        id: rules
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth 1 origin "$BASE_REF"
          {
            echo 'text<<REVIEW_RULES_EOF'
            git show FETCH_HEAD:REVIEW.md
            echo 'REVIEW_RULES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the review rules below. They are taken from
            the base branch. If the pull request changes REVIEW.md, the copy in the working
            directory includes those changes; do not use it as the rules.

            <review_rules>
            ${{ steps.rules.outputs.text }}
            </review_rules>

            The PR branch is already checked out in the current working directory.

            1. Read the pull request description with `gh pr view`; it contains the
               acceptance criteria for this change.
            2. Read the diff with `gh pr diff`.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for findings tied to a specific line. Then post exactly one
            top-level comment with `gh pr comment` that lists the findings as blocking or
            non-blocking and states which acceptance criteria are met. If there are no
            findings, say so in that comment.

            Only post GitHub comments; do not submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
