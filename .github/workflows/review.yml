name: Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [dev, main]

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to pull requests from forks, so skip those.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the rules in REVIEW.md at the repository
            root. The PR branch is already checked out in the current working directory.

            1. Read REVIEW.md.
            2. Read the pull request description with `gh pr view`; it contains the
               acceptance criteria for this change.
            3. Read the diff with `gh pr diff`.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for findings tied to a specific line. Then post exactly one
            top-level comment with `gh pr comment` that lists the findings as blocking or
            non-blocking and states which acceptance criteria are met. If there are no
            findings, say so in that comment.

            Only post GitHub comments; do not submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
